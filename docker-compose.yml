services:
  whisperx:
    build:
      context: .
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/cu121
    container_name: whisperx
    ports:
      - "5000:5000"
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - WHISPER_MODEL=${WHISPER_MODEL:-medium}
      - COMPUTE_TYPE=${COMPUTE_TYPE:-}
    volumes:
      - whisperx-models:/app/.cache/huggingface
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  whisperx-models: